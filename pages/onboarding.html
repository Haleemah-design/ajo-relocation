<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Àjò — Start Your Japa Journey</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="onboarding-page">

        <!-- ================= TOP BAR ================= -->

        <header class="onboarding-header">

           <a href="index.html" class="logo">
               <img src="../images/logo.png" alt="" srcset="">
            </a>

            <div class="step-indicator">

                <div class="step-dots">
                    <span class="active"></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <span class="step-number">1 of 4</span>

            </div>

        </header>


        <!-- ================= WELCOME CONTENT ================= -->

        <section class="welcome-section">

            <!-- Left -->
            <div class="welcome-content">

                <div class="welcome-badge">
                    <span>🌍</span>
                    Your Japa Journey, Simplified
                </div>

                <h1>
                    Let's plan your
                    <span>Japa journey.</span>
                </h1>

                <p>
                    Tell us a little about your plans and we'll
                    build a personalized roadmap to guide your
                    relocation process.
                </p>

                <a href="destination.html" class="welcome-button">
                    Let's Get Started
                    <span>→</span>
                </a>

            </div>


            <!-- Right -->
            <div class="welcome-image">

                <img
                    src="../images/onboarding-travel.jpeg"
                    alt="Travel essentials including passport, airplane and luggage"
                >

            </div>

        </section>


        <!-- ================= SECURITY ================= -->

        <div class="security-message">

            <span class="security-icon">♢</span>

            <p>
                <strong>Your data is safe with us.</strong>
                We use bank-grade security to encrypt your personal information.
            </p>

        </div>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
