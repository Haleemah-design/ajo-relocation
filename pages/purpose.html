<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Àjò — Your Purpose</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="onboarding-page">

        <!-- HEADER -->

        <header class="onboarding-header">

            <a href="index.html" class="logo">
               <img src="../images/logo.png" alt="" srcset="">
            </a>

            <div class="step-indicator">

                <div class="step-dots">
                    <span></span>
                    <span></span>
                    <span class="active"></span>
                    <span></span>
                </div>

                <span class="step-number">3 of 4</span>

            </div>

        </header>


        <!-- PURPOSE -->

        <section class="choice-section">

            <a href="destination.html" class="back-link">
                ← <span>Back</span>
            </a>


            <div class="choice-heading">

                <h1>
                    Why are you planning to Japa?
                </h1>

                <p>
                    Tell us your main reason for relocating so we
                    can personalize your journey.
                </p>

            </div>


            <!-- PURPOSE OPTIONS -->

            <div class="purpose-grid">

                <button class="purpose-card" data-purpose="Study">

                    <div class="choice-icon study-icon">
                        🎓
                    </div>

                    <div>
                        <h2>Study</h2>

                        <p>
                            University, college or other education.
                        </p>
                    </div>

                    <span class="choice-check">✓</span>

                </button>


                <button class="purpose-card" data-purpose="Work">

                    <div class="choice-icon work-icon">
                        💼
                    </div>

                    <div>
                        <h2>Work</h2>

                        <p>
                            Start a new job or career abroad.
                        </p>
                    </div>

                    <span class="choice-check">✓</span>

                </button>


                <button class="purpose-card" data-purpose="Family">

                    <div class="choice-icon family-icon">
                        👨‍👩‍👧
                    </div>

                    <div>
                        <h2>Family</h2>

                        <p>
                            Join family members living abroad.
                        </p>
                    </div>

                    <span class="choice-check">✓</span>

                </button>


                <button class="purpose-card" data-purpose="Permanent Relocation">

                    <div class="choice-icon relocation-icon">
                        🏡
                    </div>

                    <div>
                        <h2>Permanent Relocation</h2>

                        <p>
                            Build a long-term life in another country.
                        </p>
                    </div>

                    <span class="choice-check">✓</span>

                </button>


                <button class="purpose-card" data-purpose="Not Sure Yet">

                    <div class="choice-icon unsure-icon">
                        🌍
                    </div>

                    <div>
                        <h2>Not Sure Yet</h2>

                        <p>
                            I'm still exploring my options.
                        </p>
                    </div>

                    <span class="choice-check">✓</span>

                </button>

            </div>


            <!-- CONTINUE -->

            <div class="choice-actions">

                <button class="continue-button" id="purposeContinue">
                    Continue →
                </button>

            </div>

        </section>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
